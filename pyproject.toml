[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evtx-wazuh-rules"
version = "1.0.0"
description = "Build a Wazuh detection rule database from EVTX attack samples and SigmaHQ rules"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Saif Eddinne Belaarbi", email = "intercs166@gmail.com" },
]
dependencies = [
    "python-evtx>=0.7.4",
    "pyyaml>=6.0",
    "lxml>=4.9",
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
report = [
    "openpyxl>=3.1",
]

[project.scripts]
evtx-collector = "collector.cli:cli"
evtx-generator = "generator.cli:cli"

[tool.setuptools.packages.find]
include = ["collector*", "generator*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
