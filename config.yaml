id_range:
  start: 100000
  end: 120000

paths:
  evtx_data: data/evtx_samples
  sigma_data: data/sigma_rules
  wazuh_defaults: data/wazuh_defaults
  cache: data/cache
  rules_output: database/rules
  drafts: database/drafts
  metadata: database/metadata

wazuh:
  deploy_path: /var/ossec/etc/rules/
  parent_sids:
    eventchannel: 60000
    sysmon: 60009
    sysmon_process_create: 61600
    sysmon_network_connect: 61603
    sysmon_file_create: 61601
    sysmon_registry_event: 61612
    sysmon_dns_query: 61625
    sysmon_process_access: 61616
    windows_security: 60100
    windows_system: 60106
    windows_powershell: 91801

