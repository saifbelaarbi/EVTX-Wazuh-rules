  credential_access:     { start: 105000, end: 105999 }
  discovery:             { start: 106000, end: 106999 }
  lateral_movement:      { start: 107000, end: 107999 }
  collection:            { start: 108000, end: 108999 }
  command_and_control:   { start: 109000, end: 109999 }
  exfiltration:          { start: 110000, end: 110999 }
  impact:                { start: 111000, end: 111999 }
  composite:             { start: 112000, end: 119999 }
