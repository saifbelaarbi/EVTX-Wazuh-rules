id_range:
  start: 100000
  end: 119999

paths:
  evtx_data: data/evtx_samples
  sigma_data: data/sigma_rules
  wazuh_defaults: data/wazuh_defaults
  cache: data/cache
  rules_output: database/rules
  drafts: database/drafts
  metadata: database/metadata

wazuh:
  deploy_path: /var/ossec/etc/rules/

  # Live logtest via Wazuh REST API (primary)
  # api_url: https://wazuh-manager:55000
  # api_user: wazuh-wui
  # api_password_file: ~/.wazuh_api_token
  # api_verify_ssl: false

  # Live logtest via SSH (fallback)
  # ssh_host: wazuh-manager
  # ssh_user: wazuh
  # ssh_key: ~/.ssh/wazuh_key
  # logtest_path: /var/ossec/bin/wazuh-logtest
  # sudo: true

  parent_sids:
    eventchannel: 60000
    sysmon: 60009
    sysmon_process_create: 61600
    sysmon_network_connect: 61603
    sysmon_file_create: 61601
    sysmon_registry_event: 61612
    sysmon_dns_query: 61625
    sysmon_process_access: 61616
    windows_security: 60100
    windows_system: 60106
    windows_powershell: 91801

tactic_id_ranges:
  execution:             { start: 100000, end: 103999 }
  persistence:           { start: 104000, end: 106999 }
  privilege_escalation:  { start: 107000, end: 108499 }
  credential_access:     { start: 108500, end: 109999 }
  command_and_control:   { start: 110000, end: 110999 }
  discovery:             { start: 111000, end: 111999 }
  defense_evasion:       { start: 112000, end: 112499 }
  lateral_movement:      { start: 112500, end: 112999 }
  initial_access:        { start: 113000, end: 113499 }
  collection:            { start: 113500, end: 113999 }
  impact:                { start: 114000, end: 114499 }
  exfiltration:          { start: 114500, end: 114999 }
  composite:             { start: 115000, end: 119999 }
