name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m generator validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  integration-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Run full pipeline with Wazuh manager
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from pipeline 2>&1 | tee /tmp/integration.log

      - name: Collect results
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Rule count
          if [ -f database/metadata/rule_index.json ]; then
            RULES=$(grep -c '"rule_id"' database/metadata/rule_index.json 2>/dev/null || echo "0")
            echo "- **Rules generated**: $RULES" >> $GITHUB_STEP_SUMMARY
          fi

          # Tactic files deployed
          TACTIC_FILES=$(ls database/rules/by_tactic/*.xml 2>/dev/null | wc -l || echo "0")
          echo "- **Tactic files**: $TACTIC_FILES" >> $GITHUB_STEP_SUMMARY

          # Validation results
          if [ -f database/metadata/validation_results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Logtest Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          v = json.load(open('database/metadata/validation_results.json'))
          print(json.dumps({k: v[k] for k in ['mode','total_rules','passed','failed','pass_rate','inconclusive'] if k in v}, indent=2))
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || cat database/metadata/validation_results.json | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # Run summary JSON
          if ls database/logs/run-*.json 2>/dev/null; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Run Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat database/logs/run-*.json >> $GITHUB_STEP_SUMMARY 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Last 200 lines of pipeline output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/integration.log >> $GITHUB_STEP_SUMMARY 2>/dev/null
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Verify results
        if: always()
        run: |
          ERRORS=0

          # Check rules were generated
          if [ ! -f database/metadata/rule_index.json ]; then
            echo "::error::No rule_index.json — pipeline did not generate rules"
            ERRORS=$((ERRORS + 1))
          else
            RULES=$(grep -c '"rule_id"' database/metadata/rule_index.json 2>/dev/null || echo "0")
            if [ "$RULES" -lt 1000 ]; then
              echo "::error::Only $RULES rules generated (expected 3000+)"
              ERRORS=$((ERRORS + 1))
            else
              echo ">> $RULES rules generated"
            fi
          fi

          # Check tactic files exist
          TACTIC_FILES=$(ls database/rules/by_tactic/*.xml 2>/dev/null | wc -l || echo "0")
          if [ "$TACTIC_FILES" -lt 10 ]; then
            echo "::error::Only $TACTIC_FILES tactic files (expected 12)"
            ERRORS=$((ERRORS + 1))
          else
            echo ">> $TACTIC_FILES tactic files"
          fi

          # Check simulation logtest pass rate
          if [ -f database/metadata/validation_results.json ]; then
            PASS_RATE=$(python3 -c "
          import json
          v = json.load(open('database/metadata/validation_results.json'))
          rate = v.get('pass_rate', '0%')
          print(rate.replace('%',''))" 2>/dev/null || echo "0")

            PASS_INT=$(echo "$PASS_RATE" | cut -d. -f1)
            if [ "$PASS_INT" -lt 50 ]; then
              echo "::error::Pass rate ${PASS_RATE}% is below 50% threshold"
              ERRORS=$((ERRORS + 1))
            else
              echo ">> Pass rate: ${PASS_RATE}%"
            fi
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Integration test failed with $ERRORS error(s)"
            exit 1
          fi
          echo ">> Integration test passed"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_number }}
          path: |
            /tmp/integration.log
            database/logs/
            database/metadata/validation_results.json
            database/metadata/rule_index.json
          retention-days: 30
