sources:
  - name: EVTX-ATTACK-SAMPLES
    repo: sbousseaden/EVTX-ATTACK-SAMPLES
    url: https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES.git
    type: github_clone
    description: "~200 EVTX samples organized by MITRE ATT&CK tactic"
    mitre_mapped: true
    structure: by_tactic
    tactic_dirs:
      - "Command and Control"
      - "Credential Access"
      - "Defense Evasion"
      - "Discovery"
      - "Execution"
      - "Lateral Movement"
      - "Persistence"
      - "Privilege Escalation"
      - "Other"

  - name: EVTX-to-MITRE-Attack
    repo: mdecrevoisier/EVTX-to-MITRE-Attack
    url: https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack.git
    type: github_clone
    description: "270+ EVTX samples mapped to ATT&CK techniques"
    mitre_mapped: true
    structure: by_tactic

  - name: hayabusa-sample-evtx
    repo: Yamato-Security/hayabusa-sample-evtx
    url: https://github.com/Yamato-Security/hayabusa-sample-evtx.git
    type: github_clone
    description: "Aggregated EVTX samples from multiple security research sources"
    mitre_mapped: false
    structure: by_source
    sub_sources:
      - DeepBlueCLI
      - EVTX-ATTACK-SAMPLES
      - EVTX-to-MITRE-Attack
      - YamatoSecurity

  - name: Security-Datasets
    repo: OTRF/Security-Datasets
    url: https://github.com/OTRF/Security-Datasets.git
    type: github_clone
    description: "Pre-recorded adversary simulation data (Mordor) mapped to MITRE ATT&CK"
    mitre_mapped: true
    structure: by_tactic
    formats:
      - json
      - evtx

  - name: danderspritz-evtx
    repo: fox-it/danderspritz-evtx
    url: https://github.com/fox-it/danderspritz-evtx.git
    type: github_clone
    description: "DanderSpritz (NSA EternalBlue toolset) EVTX detection events"
    mitre_mapped: false
    structure: flat

  - name: evtx-hunter
    repo: NVISOsecurity/evtx-hunter
    url: https://github.com/NVISOsecurity/evtx-hunter.git
    type: github_clone
    description: "Security-related EVTX activity identification by NVISO"
    mitre_mapped: false
    structure: flat

  - name: ThreatSeeker
    repo: ine-labs/ThreatSeeker
    url: https://github.com/ine-labs/ThreatSeeker.git
    type: github_clone
    description: "Threat hunting via Windows Event Logs analysis"
    mitre_mapped: false
    structure: flat
